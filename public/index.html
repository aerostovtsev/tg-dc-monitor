<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TG DC Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;--s1:#0d1117;--s2:#161d27;--s3:#1e2736;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.1);
  --blue:#3b9eff;--green:#3dffa0;--red:#ff4560;--yellow:#ffc53d;--purple:#b48cff;
  --t1:#e2eaf5;--t2:#8899b0;--t3:#506070;
  --mono:'JetBrains Mono',monospace;
}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--mono);font-size:13px}
body{background-image:radial-gradient(ellipse 60% 30% at 50% 0%,rgba(59,158,255,0.06),transparent)}

.wrap{max-width:680px;margin:0 auto;padding:32px 16px 64px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:glow 2s infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--t1)}
.hdr-sub{font-size:11px;color:var(--t3);margin-top:2px}
.hdr-timer{font-size:11px;color:var(--t3);text-align:right}
.hdr-timer span{color:var(--blue);font-weight:500}

/* Summary */
.sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.sumcard{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px 14px}
.sumcard__label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.sumcard__val{font-size:20px;font-weight:700;color:var(--t1)}
.sumcard__val--ok{color:var(--green)}
.sumcard__val--warn{color:var(--yellow)}
.sumcard__val--bad{color:var(--red)}

/* DC grid */
.grid{display:flex;flex-direction:column;gap:6px}

/* DC row */
.row{display:grid;grid-template-columns:80px 1fr 90px 36px;align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:10px 14px;
  transition:background .15s,border-color .15s;cursor:default}
.row:hover{background:var(--s2);border-color:var(--b2)}
.row--off{border-color:rgba(255,69,96,.15);background:rgba(255,69,96,.03)}
.row--off:hover{background:rgba(255,69,96,.05)}

.row__name{display:flex;flex-direction:column;gap:3px}
.row__id{font-size:13px;font-weight:700;color:var(--t1)}
.row__badges{display:flex;gap:4px}
.badge{font-size:9px;font-weight:700;letter-spacing:.6px;padding:1px 5px;border-radius:3px}
.badge--main{background:rgba(59,158,255,.12);color:var(--blue)}
.badge--media{background:rgba(180,140,255,.12);color:var(--purple)}
.badge--cdn{background:rgba(255,197,61,.12);color:var(--yellow)}

.row__info{display:flex;flex-direction:column;gap:4px;min-width:0}
.row__loc{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__ip{font-size:10px;color:var(--t3)}
.row__bar-wrap{height:2px;background:var(--s3);border-radius:2px;overflow:hidden}
.row__bar{height:100%;border-radius:2px;transition:width .5s ease}

.row__lat{text-align:right}
.lat-num{font-size:18px;font-weight:700;line-height:1}
.lat-unit{font-size:10px;color:var(--t3);margin-left:1px}
.lat-na{font-size:16px;color:var(--t3)}

.row__status{display:flex;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot--on{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot--off{background:var(--red)}

/* Group headers */
.group-hdr{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;
  padding:12px 2px 6px;border-bottom:1px solid var(--b1);margin-bottom:6px}

/* Skeleton */
.sk{background:var(--s2);border-radius:4px;animation:shim 1.2s infinite}
@keyframes shim{0%,100%{opacity:.3}50%{opacity:.6}}

/* Error */
.err{background:rgba(255,69,96,.08);border:1px solid rgba(255,69,96,.2);
  border-radius:10px;padding:12px 16px;color:var(--red);margin-bottom:16px;font-size:12px}

/* History sparkline */
.row__spark{display:none}
@media(min-width:500px){
  .row{grid-template-columns:80px 1fr 120px 90px 36px}
  .row__spark{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-dot" id="hdr-dot"></div>
      <div>
        <div class="hdr-title">Telegram DC Monitor</div>
        <div class="hdr-sub">TCP · все серверы в реальном времени</div>
      </div>
    </div>
    <div class="hdr-timer">обновление через<br><span id="countdown">—</span></div>
  </div>

  <div class="sumbar" id="sumbar">
    <div class="sumcard"><div class="sumcard__label">Всего DC</div><div class="sumcard__val sk" style="width:40px;height:24px"></div></div>
    <div class="sumcard"><div class="sumcard__label">Онлайн</div><div class="sumcard__val sk" style="width:32px;height:24px"></div></div>
    <div class="sumcard"><div class="sumcard__label">Avg latency</div><div class="sumcard__val sk" style="width:56px;height:24px"></div></div>
  </div>

  <div id="err" style="display:none" class="err"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const W = "https://tg-dc-monitor.aerostovtsev.workers.dev";
const INTERVAL = 60;

let data = null, histCache = {}, countdown = INTERVAL, initialLoad = true;

function latColor(ms) {
  if (!ms) return null;
  return ms < 80 ? "#3dffa0" : ms < 200 ? "#ffc53d" : "#ff4560";
}

function sparkSvg(pts, w=90, h=20) {
  if (!pts || pts.length < 2) return '<div style="width:'+w+'px;height:'+h+'px"></div>';
  const BW=3,GAP=1, max = Math.floor(w/(BW+GAP));
  const vis = pts.slice(-max);
  const maxL = Math.max(...vis.filter(p=>p.latency).map(p=>p.latency), 1);
  const bars = vis.map((p,i) => {
    const bh = p.online && p.latency ? Math.max(2, Math.round(p.latency/maxL*(h-2))) : 2;
    const c = !p.online ? "#ff4560" : p.latency<80 ? "#3dffa0" : p.latency<200 ? "#ffc53d" : "#ff9040";
    return `<rect x="${i*(BW+GAP)}" y="${h-bh}" width="${BW}" height="${bh}" rx="1" fill="${c}" opacity=".8"/>`;
  }).join("");
  return `<svg width="${w}" height="${h}" style="display:block">${bars}</svg>`;
}

function renderSummary(d) {
  const {total,online,avgLatency} = d.summary;
  const vc = online===total?"--ok":online===0?"--bad":"--warn";
  document.getElementById("sumbar").innerHTML = `
    <div class="sumcard"><div class="sumcard__label">Всего DC</div><div class="sumcard__val">${total}</div></div>
    <div class="sumcard"><div class="sumcard__label">Онлайн</div><div class="sumcard__val sumcard__val${vc}">${online}/${total}</div></div>
    <div class="sumcard"><div class="sumcard__label">Avg latency</div><div class="sumcard__val">${avgLatency}<span style="font-size:11px;color:var(--t3)">ms</span></div></div>`;
  const dot = document.getElementById("hdr-dot");
  dot.style.background = online===total?"var(--green)":online===0?"var(--red)":"var(--yellow)";
  dot.style.boxShadow = `0 0 8px ${online===total?"var(--green)":online===0?"var(--red)":"var(--yellow)"}`;
}

function renderGroup(label, dcs) {
  const hdr = `<div class="group-hdr">${label}</div>`;
  const rows = dcs.map((dc, i) => {
    const hist = histCache[dc.id] || [];
    const pct = dc.latency ? Math.min(100,(dc.latency/400)*100) : 0;
    const col = latColor(dc.latency) || "var(--t3)";
    const uptime = hist.length > 0
      ? Math.round(hist.filter(p=>p.online).length/hist.length*1000)/10
      : null;
    return `
    <div class="row${dc.online?"":" row--off"}">
      <div class="row__name">
        <div class="row__id">${dc.name}</div>
        <div class="row__badges"><span class="badge badge--${dc.type}">${dc.type.toUpperCase()}</span></div>
      </div>
      <div class="row__info">
        <div class="row__loc">${dc.flag} ${dc.location}</div>
        <div class="row__ip">${dc.ip}</div>
        <div class="row__bar-wrap"><div class="row__bar" style="width:${pct}%;background:${col}"></div></div>
      </div>
      <div class="row__spark">
        ${hist.length > 1 ? sparkSvg(hist) : '<div style="width:90px;height:20px;display:flex;align-items:center"><span style="font-size:10px;color:var(--t3)">накапливается…</span></div>'}
        ${uptime!==null?`<div style="font-size:10px;color:${uptime>=99?"var(--green)":uptime>=95?"var(--yellow)":"var(--red)"};margin-top:3px">${uptime}% up</div>`:""}
      </div>
      <div class="row__lat">
        ${dc.latency !== null
          ? `<span class="lat-num" style="color:${col}">${dc.latency}</span><span class="lat-unit">ms</span>`
          : `<span class="lat-na">—</span>`}
      </div>
      <div class="row__status"><div class="dot dot--${dc.online?"on":"off"}"></div></div>
    </div>`;
  }).join("");
  return hdr + rows;
}

function renderGrid(d) {
  const cdn_neg = d.dcs.filter(dc => dc.id === -203);
  const media   = d.dcs.filter(dc => dc.id < 0 && dc.id !== -203);
  const main    = d.dcs.filter(dc => dc.id > 0 && dc.id !== 203);
  const cdn_pos = d.dcs.filter(dc => dc.id === 203);
  let out = "";
  if (cdn_neg.length) out += renderGroup("CDN", cdn_neg);
  if (media.length)   out += renderGroup("Media серверы", media);
  if (main.length)    out += renderGroup("Основные серверы", main);
  if (cdn_pos.length) out += renderGroup("CDN", [...cdn_neg.length?[]:[...cdn_neg], ...cdn_pos]);
  document.getElementById("grid").innerHTML = out;
}

function renderSkeletons() {
  document.getElementById("grid").innerHTML = Array.from({length:12},(_,i)=>`
    <div class="row" style="animation-delay:${i*30}ms">
      <div class="sk" style="width:54px;height:32px;border-radius:6px"></div>
      <div style="display:flex;flex-direction:column;gap:5px;flex:1">
        <div class="sk" style="width:80px;height:10px"></div>
        <div class="sk" style="width:110px;height:8px"></div>
        <div class="sk" style="width:100%;height:2px;margin-top:2px"></div>
      </div>
      <div class="sk" style="width:50px;height:28px;border-radius:4px;justify-self:end"></div>
      <div class="sk" style="width:8px;height:8px;border-radius:50%"></div>
    </div>`).join("");
}

async function fetchHistory(dcs) {
  await Promise.all(dcs.map(async dc => {
    try {
      const r = await fetch(`${W}/api/history?id=${dc.id}`);
      histCache[dc.id] = await r.json();
    } catch { histCache[dc.id] = []; }
  }));
}

async function fetchStatus() {
  const errEl = document.getElementById("err");
  try {
    const r = await fetch(`${W}/api/status`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    data = d;
    if (initialLoad) {
      await fetchHistory(d.dcs);
      initialLoad = false;
    } else {
      fetchHistory(d.dcs).then(() => { if(data) renderGrid(data); });
    }
    renderSummary(d);
    renderGrid(d);
    errEl.style.display = "none";
  } catch(e) {
    errEl.textContent = "⚠ Не удалось получить данные" + (data ? " — показаны последние" : "");
    errEl.style.display = "block";
  }
}

// Countdown — single setInterval
renderSkeletons();
fetchStatus().then(() => {
  countdown = INTERVAL;
  setInterval(() => {
    countdown--;
    const el = document.getElementById("countdown");
    if (el) el.textContent = countdown + "с";
    if (countdown <= 0) {
      countdown = INTERVAL;
      fetchStatus();
    }
  }, 1000);
});
</script>
</body>
</html>
